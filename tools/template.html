<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>$title$</title>
<style>
@page { size: A4; margin: 18mm 16mm; }
body { font-family: "DejaVu Sans", Arial, sans-serif; font-size: 10pt; line-height: 1.45; color: #1c1c1c; max-width: 190mm; margin: 0 auto; }
h1 { font-size: 20pt; margin: 1.2em 0 0.4em; border-bottom: 2px solid #345; padding-bottom: 0.15em; page-break-before: always; }
h1.first { page-break-before: avoid; }
h2 { font-size: 14pt; margin: 1.4em 0 0.4em; color: #234; }
h3 { font-size: 11.5pt; margin: 1.2em 0 0.3em; color: #234; }
p, li { orphans: 3; widows: 3; }
code { font-family: "DejaVu Sans Mono", "Courier New", Courier; font-size: 8.6pt; background: #f1f1ee; padding: 0 2px; }
pre { background: #f4f4f1; border: 1px solid #d8d8d2; padding: 6px 8px; font-size: 8pt; line-height: 1.3; overflow-x: auto; word-break: break-all; page-break-inside: avoid; }
pre code { background: none; padding: 0; font-size: 8pt; }
table { border-collapse: collapse; width: 100%; margin: 0.8em 0; font-size: 8.8pt; }
th, td { border: 1px solid #c9c9c2; padding: 3px 5px; vertical-align: top; text-align: left; }
th { background: #e9edf1; }
tr { page-break-inside: avoid; }
blockquote { margin: 0.8em 0; padding: 0.2em 0.8em; border-left: 3px solid #567; background: #f3f6f8; }
strong { color: #111; }
#TOC { page-break-after: always; }
#TOC ul { list-style: none; padding-left: 1.2em; }
#TOC > ul { padding-left: 0; }
.title { font-size: 26pt; margin: 30mm 0 4mm; }
.subtitle { font-size: 13pt; color: #456; margin-bottom: 10mm; }
a { color: #1f4e79; text-decoration: none; }
</style>
</head>
<body>
<h1 class="title first" style="border:none">$title$</h1>
<div class="subtitle">$subtitle$</div>
$if(toc)$
<nav id="TOC">
$table-of-contents$
</nav>
$endif$
$body$
</body>
</html>
