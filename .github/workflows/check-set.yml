# SPDX-License-Identifier: Apache-2.0
# Checks a change to the guide set itself (tools, profiles, schemas, rules, guides, skills): the generated files are current, the set agrees with
# itself (test_sync.py), and every checker still catches every deliberate fault (selftest.py, which also runs the GLB option tests and the
# negative tests). check-delivery.yml checks deliveries; this one checks everything else.
# Contributors work from forks, so this runs on the plain `pull_request` event: the token is read-only and no secret is available to it. Do NOT
# change the trigger to `pull_request_target`: that would run contributed code with write access and secrets.
name: check-set

on:
  pull_request:
    paths:
      - "tools/**"
      - "profiles/**"
      - "schemas/**"
      - "templates/**"
      - "skills/**"
      - "chunks/**"
      - "rules.json"
      - "MANIFEST.json"
      - "MANIFEST.sha256"
      - "llms.txt"
      - "llms-full.txt"
      - "[0-9][0-9]-*.md"
      - "REPAIR-LOOP.md"
      - "README.md"
      - "AGENTS.md"
      - "ABOUT.md"
      - "CHANGELOG.md"
      - "VERSIONING.md"
      - "CONTRIBUTING.md"
      - ".github/workflows/check-set.yml"
  push:
    branches: [ "main" ]
    paths:
      - "tools/**"
      - "profiles/**"
      - "schemas/**"
      - "templates/**"
      - "skills/**"
      - "chunks/**"
      - "rules.json"
      - "MANIFEST.json"
      - "MANIFEST.sha256"
      - "llms.txt"
      - "llms-full.txt"
      - "[0-9][0-9]-*.md"
      - "REPAIR-LOOP.md"
      - "README.md"
      - "AGENTS.md"
      - "ABOUT.md"
      - "CHANGELOG.md"
      - "VERSIONING.md"
      - "CONTRIBUTING.md"
      - ".github/workflows/check-set.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-set-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tools/requirements-ci.txt
      - name: Install pinned requirements
        run: python -m pip install -r tools/requirements-ci.txt
      - name: Generated files are current
        run: python tools/gen_all.py --check
      - name: The set agrees with itself
        run: python tools/test_sync.py
      - name: Every checker still catches every deliberate fault
        run: python tools/selftest.py
