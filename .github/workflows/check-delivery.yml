# SPDX-License-Identifier: Apache-2.0
# Checks a delivery offered as a pull request. Contributors work from forks, so this runs on the plain `pull_request` event: the token
# is read-only, no secret is available to it, and the code under test is never given more than that. Do NOT change the trigger to
# `pull_request_target`: that would run contributed files with write access and secrets.
# A first-time contributor's run may wait for a maintainer to approve it (repository setting: "Require approval for first-time
# contributors"). Besides the form and package checks it rebuilds the delivery's proofs (GLB files and renders) on the runner, which has
# no graphics card: the renderer is a software rasteriser (tools/render.py). The result is the job summary of the run, the JSON reports (artifact `delivery-check-reports`) and, for pull requests
# from branches of this repository only, a comment (a fork's token cannot write comments).
name: check-delivery

on:
  pull_request:
    paths:
      - "deliveries/**"
  workflow_dispatch:        # a maintainer can run the same checks on every delivery of a branch by hand (needs write access to the repository)

permissions:
  contents: read

concurrency:
  group: check-delivery-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tools/requirements-ci.txt
      - name: Install pinned requirements
        run: python -m pip install -r tools/requirements-ci.txt
      - name: Install the pinned Khronos glTF Validator
        # Public package, pinned by tools/khronos/package-lock.json (with its integrity hash); no secret is needed and install scripts are off.
        run: npm ci --ignore-scripts --no-audit --no-fund --prefix tools/khronos
      - name: Check the changed deliveries
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_REQUIRE_KHRONOS: "1"
        run: |
          set +e
          bash tools/ci/run_checks.sh ${BASE_SHA:+--base "$BASE_SHA"} --out ci-reports
          status=$?
          cat ci-reports/summary.md >> "$GITHUB_STEP_SUMMARY"
          exit $status
      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: delivery-check-reports
          path: ci-reports/
          if-no-files-found: ignore
          retention-days: 30

  comment:
    # Only for pull requests from this repository's own branches; a pull request from a fork gets no comment (its token is read-only).
    needs: check
    if: ${{ always() && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: delivery-check-reports
          path: ci-reports
        continue-on-error: true
      - name: Comment the summary
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          test -f ci-reports/summary.md || exit 0
          gh pr comment "$PR" --repo "$REPO" --body-file ci-reports/summary.md
